odos os níveis e acompanhamento claro do progresso.\"},{\"name\":\"PoTreeDC\",\"text\":\"É excelente!! Estou usando há uns 5 meses, perdi 9 kg e ganhei muita força e definição. Os treinos são claros e fáceis de seguir, sem enrolação. Recomendo demais para quem está começando.\"}],\"disclaimer\":\"Seguir o plano de exercícios e alimentação é a chave da sua jornada e impacta muito os resultados. Em 4 semanas, os usuários normalmente perdem no máximo 0,45-0,90 kg por semana. Os resultados individuais podem variar.\"},\"finalTitle\":\"Resultados visíveis em 4 semanas!\",\"guarantee\":{\"title\":\"Garantia de reembolso de 90 dias\",\"body\":\"Acreditamos que nosso plano vai funcionar para você — e que os resultados vão aparecer em apenas 4 semanas! Estamos até dispostos a devolver seu dinheiro se você demonstrar que seguiu o plano e não viu nenhum resultado.\",\"linkText\":\"política de reembolso\"}}]}}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#141218\"}]]\nc:null\n"])</script><script>self.__next_f.push([1,"e:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Pilates na Parede\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Plano personalizado em 1 minuto.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"13:\"$e:metadata\"\n"])</script></body></html>
